[project]
name = "vibe-predict"
version = "0.1.0"
description = "A platform for designing and evaluating prediction-market strategies on Polymarket. Contains tooling for specifying strategies in natural language, backtesting them against historical market prices, paper trading them on live order books, and auditing every forecast and position through a browser, with no programming required."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.5.0",
    "boto3>=1.43.100",
    "croniter>=6.2.4",
    "cryptography>=50.0.1",
    "duckdb>=1.5.5",
    "eth-hash[pycryptodome]>=0.7",
    "eth-keys>=0.7",
    "fastapi>=0.115",
    "keyring>=25.7.0",
    "matplotlib>=3.11.2",
    "mcp>=1.20",
    "numpy>=2.3.5",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "prometheus-client>=0.26.0",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.12",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "requests>=2.32.5",
    "uvicorn>=0.32",
    "websockets>=17.1",
]

[project.scripts]
vp = "vp.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "httpx>=0.28",
    "moto[s3]>=5.2.3",
    "pre-commit>=4.5.0",
    "pytest>=9.1.1",
    "ruff>=0.14.8",
    "ty>=0.0.1a32",
    "types-croniter>=6.2.4.20260711",
    "types-requests>=2.32",
]

[tool.hatch.build.targets.wheel]
packages = ["vp"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = ["archive/**"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
