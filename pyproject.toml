[project]
name = "vibe-predict"
version = "0.1.0"
description = "An LLM forecaster for binary prediction-market contracts on Polymarket, scored by backtest and paper trading before any live execution."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.5.0",
    "matplotlib>=3.11.2",
    "numpy>=2.3.5",
    "pyarrow>=25.0.1",
    "requests>=2.32.5",
]

[project.scripts]
vp = "vp.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.0",
    "pytest>=9.1.1",
    "ruff>=0.14.8",
    "ty>=0.0.1a32",
    "types-requests>=2.32",
]

[tool.hatch.build.targets.wheel]
packages = ["vp"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = ["archive/**"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
