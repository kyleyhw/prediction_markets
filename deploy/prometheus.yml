# Prometheus for the local stand-in: the web service's /metrics behind its
# token, and each worker pool and the ingest service on their own ports.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: web
    metrics_path: /metrics
    authorization:
      credentials: vp-metrics-dev  # the VP_METRICS_TOKEN default; pragma: allowlist secret
    static_configs:
      - targets: ["web:8000"]
  - job_name: workers
    static_configs:
      - targets: ["worker-interactive:9101", "worker-paper:9102", "worker-platform:9103", "worker-data:9105"]
  - job_name: ingest
    static_configs:
      - targets: ["ingest:9104"]
