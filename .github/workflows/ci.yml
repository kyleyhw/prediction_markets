# Tests, lint and types on every push and pull request, then the image the
# platform runs as. No deploy step: the cloud deploy is deferred to the end
# of the build (plan, task 34, flag F16).
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-owner  # pragma: allowlist secret
          POSTGRES_DB: vp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-retries 30
    env:
      VP_TEST_DATABASE_URL: postgresql://postgres:ci-owner@localhost:5432/vp_test  # pragma: allowlist secret
      VP_TEST_APP_DATABASE_URL: postgresql://vp_app:ci-app@localhost:5432/vp_test  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: The application role, with a password for TCP connections
        run: PGPASSWORD=ci-owner psql -h localhost -U postgres -d vp_test -c "create role vp_app login password 'ci-app'"  # pragma: allowlist secret
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the platform image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vibe-predict:ci
