# Tests, lint and types on every push and pull request, then the image the
# platform runs as. No deploy step: the cloud deploy is deferred to the end
# of the build (plan, task 34, flag F16).
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Contributions carry a Developer Certificate of Origin sign-off on every
  # commit (CONTRIBUTING.md, plan task 90).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c has no Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-owner  # pragma: allowlist secret
          POSTGRES_DB: vp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-retries 30
    env:
      VP_TEST_DATABASE_URL: postgresql://postgres:ci-owner@localhost:5432/vp_test  # pragma: allowlist secret
      VP_TEST_APP_DATABASE_URL: postgresql://vp_app:ci-app@localhost:5432/vp_test  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: The application role, with a password for TCP connections
        run: PGPASSWORD=ci-owner psql -h localhost -U postgres -d vp_test -c "create role vp_app login password 'ci-app'"  # pragma: allowlist secret
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q

  # The documentation site (docs/site.md): built from the repository, and
  # failed on a broken link, anchor or documented command. Kept as an
  # artifact; publishing it is decided with the deploy.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # each page's last-verified date comes from git
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run vp site --out _site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the platform image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vibe-predict:ci
